# ========================
# YiYi97 博客配置
# ========================

title: 飞呀飞的碎碎念
description: 记录思考，分享生活 ✨
author: 飞呀飞
email: cyf97@zju.edu.cn
github: YiYi97
url: https://YiYi97.github.io
lang: zh-CN

# 时区
timezone: Asia/Shanghai

# Markdown 引擎
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# 排除不需要处理的文件
exclude:
  - README.md
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - 使用说明.md
  - 文章模板.md

# 默认 front matter
defaults:
  - scope:
      path: "_posts"
    values:
      layout: post
      permalink: /:year/:month/:day/:title/
